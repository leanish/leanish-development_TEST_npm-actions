name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
